<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBBS World - Clinical Sim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/daily-case.css">
</head>
<body>

    <div class="sim-container">
        
        <header class="sim-header">
            <div class="case-number">
                <span class="small-text">Case</span>
                <span class="big-text">#158</span>
            </div>
            <div class="case-title" id="phaseLabel">Load a case...</div>
            <div class="menu-icon"><i class="fas fa-bars"></i></div>
        </header>

        <div class="avatar-row">
            <div class="avatar-container">
                <div class="avatar-circle"><i class="fas fa-user-md"></i></div>
                <div class="avatar-label">Attending</div>
            </div>
            <div class="avatar-container">
                <div class="avatar-circle nurse"><i class="fas fa-user-nurse"></i></div>
                <div class="avatar-label">Nurse</div>
            </div>
        </div>

        <div class="sim-body">
            
            <div class="side-tabs left">
                <button class="side-tab active" data-phase="history" onclick="switchPhase('history')">Patient</button>
                <button class="side-tab" data-phase="examination" onclick="switchPhase('examination')">Exam</button>
                <button class="side-tab emergency-tab" data-phase="emergency" onclick="switchPhase('emergency')">Stabilize</button>
            </div>

            <div class="side-tabs right">
                <button class="side-tab" data-phase="investigation" onclick="switchPhase('investigation')">Investigations</button>
                <button class="side-tab" data-phase="management" onclick="switchPhase('management')">Interventions</button>
                <button class="side-tab" data-phase="diagnosis" onclick="switchPhase('diagnosis')">Handoff</button>
            </div>

        </div>

        <div class="chat-overlay">
            
            <div class="quick-chips" id="quickChips"></div>
            
            <main class="chat-container" id="chatContainer">
                <div class="message-wrapper ai">
                    <div class="message ai">
                        <div class="ai-content">
                            A new patient has arrived. What would you like to do? Select a tab to interact.
                        </div>
                    </div>
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="message ai">
                        <div style="display:flex;gap:4px;padding:4px;">
                            <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type your action or question..." autocomplete="off">
                <button id="sendBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>

    </div>

    <div style="position:absolute; top:0; left:0; opacity:0.1; z-index:999;">
        <input type="text" id="diseaseInput" placeholder="Disease">
        <button id="startCaseBtn">Start</button>
    </div>

    <script src="js/daily-case.js"></script>
</body>
</html>
