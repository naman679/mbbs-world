<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Case - MBBS World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/daily-case.css">
</head>
<body>

    <!-- HEADER -->
    <header class="tutor-header">
        <div class="header-left">
            <div class="header-title">
                <i class="fas fa-stethoscope"></i>
                <span>The Daily Case</span>
            </div>
            <div class="header-subtitle" id="phaseLabel">📋 Phase 1: History Taking</div>
        </div>

        <!-- CUSTOM DISEASE INPUT -->
        <div class="disease-bar">
            <input type="text" id="diseaseInput" placeholder="Enter disease to start custom case..." autocomplete="off">
            <button id="startCaseBtn"><i class="fas fa-plus"></i> New Case</button>
        </div>

        <a href="dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
    </header>

    <!-- PHASE PROGRESS BAR -->
    <div class="phase-bar">
        <button class="phase-step active" data-phase="history" onclick="switchPhase('history')">
            <span class="phase-dot">1</span>
            <span class="phase-label">History</span>
        </button>
        <div class="phase-connector"></div>
        <button class="phase-step" data-phase="examination" onclick="switchPhase('examination')">
            <span class="phase-dot">2</span>
            <span class="phase-label">Examination</span>
        </button>
        <div class="phase-connector"></div>
        <button class="phase-step" data-phase="investigation" onclick="switchPhase('investigation')">
            <span class="phase-dot">3</span>
            <span class="phase-label">Investigations</span>
        </button>
        <div class="phase-connector"></div>
        <button class="phase-step" data-phase="diagnosis" onclick="switchPhase('diagnosis')">
            <span class="phase-dot">4</span>
            <span class="phase-label">Diagnosis</span>
        </button>
        <div class="phase-connector"></div>
        <button class="phase-step" data-phase="management" onclick="switchPhase('management')">
            <span class="phase-dot">5</span>
            <span class="phase-label">Management</span>
        </button>
        <div class="phase-connector"></div>
        <button class="phase-step emergency-btn" data-phase="emergency" onclick="switchPhase('emergency')">
            <span class="phase-dot">🚨</span>
            <span class="phase-label">Emergency</span>
        </button>
        <button class="next-phase-btn" id="nextPhaseBtn" onclick="moveToNextPhase()">
            Next Phase <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- PHASE HINT BANNER -->
    <div class="phase-hint" id="phaseHint">
        Ask the patient about their symptoms, duration, past history, family history...
    </div>

    <!-- CHAT AREA -->
    <main class="chat-container" id="chatContainer">
        <div class="message-wrapper ai">
            <div class="message ai">
                <div class="ai-avatar"><i class="fas fa-user-md"></i></div>
                <div class="ai-content">
                    Welcome Doctor. A new patient from Vijay Nagar has just arrived at the clinic. They are looking distressed. What would you like to ask them or do first?
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="message ai" style="padding:10px 16px;">
                <div class="ai-avatar" style="width:24px;height:24px;font-size:0.8rem;">
                    <i class="fas fa-user-md"></i>
                </div>
                <div style="display:flex;gap:4px;align-items:center;padding:4px 0;">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- QUICK ACTION CHIPS -->
    <div class="quick-chips" id="quickChips">
        <button class="chip" onclick="useChip(this)">Chief complaint?</button>
        <button class="chip" onclick="useChip(this)">Duration of symptoms?</button>
        <button class="chip" onclick="useChip(this)">Any fever?</button>
        <button class="chip" onclick="useChip(this)">Past medical history?</button>
        <button class="chip" onclick="useChip(this)">Family history?</button>
    </div>

    <!-- INPUT BAR -->
    <footer class="input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Ask the patient about their symptoms..." autocomplete="off">
        <button id="sendBtn" class="send-btn" title="Send">
            <i class="fas fa-paper-plane"></i>
        </button>
    </footer>

    <script src="js/daily-case.js"></script>
</body>
</html>
