<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBBS World - Live Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.5rem; text-align: center; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        .hidden { display: none !important; }
        label { display: block; font-weight: 600; margin-top: 15px; font-size: 0.9rem; color: #4b5563; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 20px; }
        button:hover:not(:disabled) { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .btn-secondary { background-color: #10b981; }
        .btn-secondary:hover:not(:disabled) { background-color: #059669; }
        .header-stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; background: #e0e7ff; padding: 15px; border-radius: 8px; color: var(--primary); }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 25px; line-height: 1.5; }
        .option-btn { background: #f9fafb; border: 2px solid #e5e7eb; color: var(--text); text-align: left; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .option-btn.correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; }
        .option-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .rank-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #e5e7eb; }
        .rank-1 { background: #fef3c7; border-radius: 8px; border: 2px solid #f59e0b; }
        .title-badge { font-size: 0.8rem; background: var(--primary); color: white; padding: 3px 8px; border-radius: 12px; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-view">
        <div class="card">
            <h2>Host a Live Quiz</h2>
            <label>Your Name (Host)</label>
            <input type="text" id="host-name" placeholder="Dr. Name">
            <label>Subject</label>
            <select id="subject-select"><option value="" disabled selected>Loading...</option></select>
            <label>Topic</label>
            <select id="topic-select" disabled><option value="" disabled selected>Select Subject First</option></select>
            <button id="create-btn" disabled>Create Room</button>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h2>Join a Room</h2>
            <label>Your Name</label>
            <input type="text" id="join-name" placeholder="Dr. Name">
            <label>6-Digit Room Code</label>
            <input type="text" id="join-code" placeholder="Enter Code" maxlength="6" style="text-align: center; font-size: 1.2rem; letter-spacing: 5px;">
            <button id="join-btn" class="btn-secondary">Join Room</button>
        </div>
    </div>

    <div id="waiting-view" class="card hidden" style="text-align: center;">
        <h2>Waiting Room</h2>
        <p style="font-size: 1.2rem; color: #4b5563;">Room Code:</p>
        <h1 id="display-room-code" style="font-size: 3rem; letter-spacing: 8px; color: var(--primary); margin: 10px 0;">------</h1>
        <div style="background: #f3f4f6; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <h3>Players Joined (<span id="player-count">1</span>)</h3>
            <ul id="players-list" style="list-style: none; padding: 0; font-size: 1.1rem; line-height: 1.8;"></ul>
        </div>
        <button id="start-game-btn" class="hidden">Start Game Now</button>
        <p id="wait-message" class="hidden">Waiting for Host to start...</p>
    </div>

    <div id="game-view" class="card hidden">
        <div class="header-stats">
            <span id="question-tracker">Q: 1/10</span>
            <span id="timer-display" style="color: #ef4444;">⏱️ 60s</span>
        </div>
        <div id="question-text" class="question-text">Loading question...</div>
        <div id="options-container"></div>
        <div id="status-message" style="text-align: center; font-weight: bold; margin-top: 15px; color: #6b7280;"></div>
    </div>

    <div id="leaderboard-view" class="card hidden">
        <h2>Final Results</h2>
        <div id="leaderboard-list"></div>
        <button onclick="location.reload()" style="margin-top: 30px;">Play Again</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";
    const app = initializeApp({
        apiKey: "AIzaSyCMhfZLVHzRMn-poqb-vdvpSpXlOcwjo90",
        authDomain: "samvad-bafaa.firebaseapp.com",
        databaseURL: "https://samvad-bafaa-default-rtdb.firebaseio.com",
        projectId: "samvad-bafaa",
        storageBucket: "samvad-bafaa.appspot.com",
        messagingSenderId: "131803431466",
        appId: "1:131803431466:web:b7b107308ea7197f013953"
    });
    window.db = getDatabase(app);
    window.dbRef = ref; window.dbSet = set; window.dbGet = get; window.dbOnValue = onValue; window.dbUpdate = update;
</script>

<script>
    const views = { setup: document.getElementById('setup-view'), waiting: document.getElementById('waiting-view'), game: document.getElementById('game-view'), leaderboard: document.getElementById('leaderboard-view') };
    function switchView(vName) { Object.values(views).forEach(v => v.classList.add('hidden')); views[vName].classList.remove('hidden'); }

    // 🔥 Added 'triggeringNext' lock to State
    let state = { playerId: 'p_' + Math.random().toString(36).substr(2, 9), playerName: '', roomCode: '', isHost: false, questions: [], currentIndex: 0, stats: { correct: 0, timeTaken: 0 }, timerInterval: null, timeLeft: 60, hasAnsweredCurrent: false, triggeringNext: false };
    
    let subjectToLinkMap = {};
    let parsedTopicBlocks = [];
    let selectedTopicIndex = -1;

    // Fetch Google Sheet
    async function initDataEngine() {
        try {
            const res = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSC_oD0BX4WhhLDL6e6WybIEXmvbiroBMBiGASJ2r-HdxlIOmDFqaWpUEMdDydPUHVOQNsOGGbgJR6O/pub?output=csv");
            let text = await res.text();
            text.replace(/^\uFEFF/, '').split(/\r?\n/).slice(1).forEach(line => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length >= 5 && cols[4].toLowerCase().includes('prepladder') && cols[1].toLowerCase().includes('quiz')) {
                    subjectToLinkMap[cols[2]] = cols[3];
                }
            });
            const sel = document.getElementById('subject-select');
            sel.innerHTML = '<option value="" disabled selected>Select Subject</option>';
            Object.keys(subjectToLinkMap).sort().forEach(sub => sel.add(new Option(sub, sub)));
        } catch (e) { alert("Failed to connect to Google Sheet!"); }
    }

    // THE ULTIMATE FETCH + HTML SCRAPER
    document.getElementById('subject-select').addEventListener('change', async (e) => {
        let fetchUrl = subjectToLinkMap[e.target.value]; 
        
        if (fetchUrl.includes("github.com") && fetchUrl.includes("/blob/")) {
            fetchUrl = fetchUrl.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
        }
        if (fetchUrl.includes("naman679.github.io")) {
            fetchUrl = fetchUrl.replace("naman679.github.io/mbbs-world", "raw.githubusercontent.com/naman679/mbbs-world/main");
        }

        const tSel = document.getElementById('topic-select');
        tSel.innerHTML = '<option value="" disabled selected>Extracting data...</option>';
        tSel.disabled = true; document.getElementById('create-btn').disabled = true;
        
        try {
            const res = await fetch(fetchUrl);
            if (!res.ok) throw new Error("GitHub Fetch Failed");
            
            const rawText = await res.text();
            parsedTopicBlocks = [];
            
            try {
                let data = JSON.parse(rawText);
                if (Array.isArray(data)) parsedTopicBlocks = data[0].questions ? data : [{topic: "Quiz", questions: data}];
                else parsedTopicBlocks = [data];
            } catch (err) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawText, 'text/html');
                const containers = doc.querySelectorAll('.iframe-container');
                
                containers.forEach(container => {
                    const titleEl = container.querySelector('h2');
                    const iframeEl = container.querySelector('iframe');
                    
                    if (titleEl && iframeEl) {
                        const topicName = titleEl.textContent.trim();
                        const srcdoc = iframeEl.getAttribute('srcdoc');
                        
                        if (srcdoc) {
                            const match = srcdoc.match(/questions\s*=\s*(\[\s*\{[\s\S]*?\}\s*\])\s*;\s*if\s*\(!Array\.isArray/);
                            if (match && match[1]) {
                                try { parsedTopicBlocks.push({ topic: topicName, questions: JSON.parse(match[1]) }); } 
                                catch (parseErr) { console.error("Scrape skip"); }
                            }
                        }
                    }
                });
            }

            tSel.innerHTML = '<option value="" disabled selected>Select Topic</option>';
            let topicsFound = 0;
            
            parsedTopicBlocks.forEach((block, idx) => {
                if (block.questions && block.questions.length > 0) {
                    tSel.add(new Option(`${block.topic || 'Topic '+(idx+1)} (${block.questions.length} Qs)`, idx));
                    topicsFound++;
                }
            });
            
            if (topicsFound === 0) alert("Could not extract questions from this file.");
            else tSel.disabled = false;
            
        } catch (e) { 
            tSel.innerHTML = '<option value="" disabled selected>Failed to read Data</option>'; 
            alert("Error parsing file: " + e.message);
        }
    });

    document.getElementById('topic-select').addEventListener('change', (e) => {
        selectedTopicIndex = parseInt(e.target.value);
        document.getElementById('create-btn').disabled = false;
    });

    // Create Room
    document.getElementById('create-btn').addEventListener('click', async () => {
        if (selectedTopicIndex === -1) return alert("Select a topic.");
        const block = parsedTopicBlocks[selectedTopicIndex];
        
        state.questions = block.questions;
        state.playerName = document.getElementById('host-name').value || "Host Doctor";
        state.isHost = true;
        state.roomCode = Math.floor(100000 + Math.random() * 900000).toString(); 

        await window.dbSet(window.dbRef(window.db, `rooms/${state.roomCode}`), {
            status: 'waiting', currentQuestionIndex: 0, questions: state.questions,
            // 🔥 Initialize answeredIndex to -1
            players: { [state.playerId]: { name: state.playerName, correct: 0, timeTaken: 0, answeredIndex: -1 } }
        });
        enterWaitingRoom();
    });

    // Join Room
    document.getElementById('join-btn').addEventListener('click', async () => {
        state.playerName = document.getElementById('join-name').value || "Doctor";
        const code = document.getElementById('join-code').value.trim();
        if (code.length !== 6) return alert("Enter 6-digit code");

        const snap = await window.dbGet(window.dbRef(window.db, `rooms/${code}`));
        if (!snap.exists()) return alert("Room not found!");

        state.roomCode = code; state.questions = snap.val().questions;
        // 🔥 Initialize answeredIndex to -1
        await window.dbUpdate(window.dbRef(window.db, `rooms/${code}/players/${state.playerId}`), { name: state.playerName, correct: 0, timeTaken: 0, answeredIndex: -1 });
        enterWaitingRoom();
    });

    function enterWaitingRoom() {
        switchView('waiting');
        document.getElementById('display-room-code').textContent = state.roomCode;
        if (state.isHost) document.getElementById('start-game-btn').classList.remove('hidden');
        else document.getElementById('wait-message').classList.remove('hidden');

        // 🔥 THE MAGIC FIX: Smart Player Listener
        window.dbOnValue(window.dbRef(window.db, `rooms/${state.roomCode}/players`), (snap) => {
            const players = snap.val() || {};
            document.getElementById('player-count').textContent = Object.keys(players).length;
            document.getElementById('players-list').innerHTML = Object.values(players).map(p => `<li>👨‍⚕️ Dr. ${p.name}</li>`).join('');

            // If we are currently IN a game, check if EVERYONE has answered!
            if (state.isHost && !document.getElementById('game-view').classList.contains('hidden')) {
                const pArray = Object.values(players);
                // Check if every player's answeredIndex matches the current question
                const allAnswered = pArray.length > 0 && pArray.every(p => p.answeredIndex === state.currentIndex);
                
                if (allAnswered && !state.triggeringNext) {
                    state.triggeringNext = true; // Lock it so it doesn't trigger twice
                    setTimeout(() => window.dbUpdate(window.dbRef(window.db, `rooms/${state.roomCode}`), { currentQuestionIndex: state.currentIndex + 1 }), 3000);
                }
            }
        });

        window.dbOnValue(window.dbRef(window.db, `rooms/${state.roomCode}/status`), (snap) => {
            if (snap.val() === 'playing') startGameEngine();
            if (snap.val() === 'finished') showLeaderboard();
        });
    }

    document.getElementById('start-game-btn').addEventListener('click', () => window.dbUpdate(window.dbRef(window.db, `rooms/${state.roomCode}`), { status: 'playing' }));

    // Game Engine
    function startGameEngine() {
        switchView('game');
        window.dbOnValue(window.dbRef(window.db, `rooms/${state.roomCode}/currentQuestionIndex`), (snap) => {
            const idx = snap.val();
            if (idx !== null && idx < state.questions.length) { state.currentIndex = idx; renderQuestion(); }
            else if (idx >= state.questions.length && state.isHost) window.dbUpdate(window.dbRef(window.db, `rooms/${state.roomCode}`), { status: 'finished' });
        });
    }

    function renderQuestion() {
        clearInterval(state.timerInterval); state.timeLeft = 60; state.hasAnsweredCurrent = false;
        state.triggeringNext = false; // 🔥 Unlock the trigger for the new question
        
        const q = state.questions[state.currentIndex];
        document.getElementById('question-tracker').textContent = `Q: ${state.currentIndex + 1} / ${state.questions.length}`;
        document.getElementById('timer-display').textContent = `⏱️ 60s`;
        document.getElementById('status-message').textContent = "";
        
        const decodeHTML = (html) => { const txt = document.createElement('textarea'); txt.innerHTML = html; return txt.value; };
        
        let qText = decodeHTML(q.text || "");
        if (q.question_images && q.question_images.length > 0) {
            qText += '<br>' + q.question_images.map(img => `<img src="${img}" style="max-width:100%; border-radius:8px; margin-top:10px;">`).join('');
        }
        document.getElementById('question-text').innerHTML = qText;
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        (q.options || []).forEach((opt, idx) => {
            const btn = document.createElement('button'); btn.className = 'option-btn';
            
            let isCorrect = false;
            let btnText = "";
            if (typeof opt === 'object') {
                isCorrect = opt.correct || false;
                btnText = opt.label ? `${opt.label}. ${decodeHTML(opt.text)}` : decodeHTML(opt.text);
            } else {
                isCorrect = (idx === q.correct_index);
                btnText = decodeHTML(opt);
            }
            
            btn.textContent = btnText;
            btn.onclick = () => handleAnswer(btn, isCorrect);
            optsContainer.appendChild(btn);
        });

        state.timerInterval = setInterval(() => {
            state.timeLeft--; document.getElementById('timer-display').textContent = `⏱️ ${state.timeLeft}s`;
            if (state.timeLeft <= 0) { clearInterval(state.timerInterval); if (!state.hasAnsweredCurrent) processTimeUp(); }
        }, 1000);
    }

    function handleAnswer(btn, isCorrect) {
        if (state.hasAnsweredCurrent) return;
        state.hasAnsweredCurrent = true; clearInterval(state.timerInterval);
        state.stats.timeTaken += (60 - state.timeLeft);
        
        if (isCorrect) { btn.classList.add('correct'); state.stats.correct++; }
        else {
            btn.classList.add('wrong');
            Array.from(document.getElementById('options-container').children).forEach((b, i) => {
                const optData = state.questions[state.currentIndex].options[i];
                if ((typeof optData === 'object' ? optData.correct : (state.questions[state.currentIndex].correct_index === i))) b.classList.add('correct');
            });
        }
        Array.from(document.getElementById('options-container').children).forEach(b => b.disabled = true);
        document.getElementById('status-message').textContent = `Waiting for others...`;
        
        pushStatsToFirebase(); 
        // 🔥 Notice we DO NOT push to the next question here anymore!
    }

    function processTimeUp() {
        state.hasAnsweredCurrent = true; state.stats.timeTaken += 60;
        Array.from(document.getElementById('options-container').children).forEach(b => b.disabled = true);
        document.getElementById('status-message').textContent = `Time's Up! Moving next...`;
        
        pushStatsToFirebase(); 
        // 🔥 We DO NOT push to the next question here anymore!
    }

    // 🔥 Added answeredIndex to tell the Host that this player is done
    function pushStatsToFirebase() { window.dbUpdate(window.dbRef(window.db, `rooms/${state.roomCode}/players/${state.playerId}`), { correct: state.stats.correct, timeTaken: state.stats.timeTaken, answeredIndex: state.currentIndex }); }

    // Leaderboard
    function showLeaderboard() {
        switchView('leaderboard'); clearInterval(state.timerInterval);
        window.dbGet(window.dbRef(window.db, `rooms/${state.roomCode}/players`)).then(snap => {
            // Sort players by correct answers, then by fastest time
            const players = Object.values(snap.val() || {}).sort((a, b) => b.correct !== a.correct ? b.correct - a.correct : a.timeTaken - b.timeTaken);
            
            document.getElementById('leaderboard-list').innerHTML = players.map((p, idx) => {
                const acc = Math.round((p.correct / state.questions.length) * 100) || 0;
                
                // 🔥 Titles assigned by RANK (idx 0 is 1st place, idx 1 is 2nd place, etc.)
                let title = "";
                if (idx === 0) title = "Asli Maggu 👑";            // 1st Place
                else if (idx === 1) title = "Jugaadu Doctor 😎";   // 2nd Place
                else if (idx === 2) title = "Bhagwan Bharose 🙏";  // 3rd Place
                else title = "Mota Back Lagega 💀";                // 4th Place & Below

                return `<div class="rank-row ${idx===0?'rank-1':''}">
                    <div style="font-size: 1.2rem; font-weight: bold; width: 40px;">#${idx + 1}</div>
                    <div style="flex-grow: 1;"><div style="font-weight: bold; font-size: 1.1rem;">Dr. ${p.name}</div><div class="title-badge">${title}</div></div>
                    <div style="text-align: right; line-height: 1.5;"><div style="color: var(--primary); font-weight: bold;">${acc}% Accuracy</div><div style="font-size: 0.9rem; color: #6b7280;">${p.correct}/${state.questions.length} • ${(p.timeTaken/state.questions.length).toFixed(1)}s avg</div></div>
                </div>`;
            }).join('');
        });
    }

    initDataEngine();
</script>
</body>
</html>
