<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBBS World - Offline</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>:root{--primary:#22d3ee;--primary-dark:#0891b2;--accent:#f472b6;--bg-dark:#060b18;--text-main:#f1f5f9;--text-light:rgba(203, 213, 225, 0.7);--font-head:'Syne',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif}*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(135deg,#060b18 0,#0a0f22 50%,#080c1e 100%);color:var(--text-main);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}body::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 15% 50%,rgba(34,211,238,.05) 0,transparent 25%),radial-gradient(circle at 85% 30%,rgba(244,114,182,.05) 0,transparent 25%);z-index:0;pointer-events:none}.container{position:relative;z-index:10;max-width:500px;padding:40px;background:rgba(255,255,255,.03);border:1px solid rgba(34,211,238,.1);border-radius:24px;backdrop-filter:blur(12px);box-shadow:0 20px 40px rgba(0,0,0,.4);animation:fadeIn .8s ease-out}.icon-container{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:rgba(244,114,182,.1);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--accent);box-shadow:0 0 20px rgba(244,114,182,.2),inset 0 0 20px rgba(244,114,182,.2);animation:pulse 2s infinite ease-in-out}h1{font-family:var(--font-head);font-size:2.5rem;margin-bottom:15px;background:linear-gradient(to right,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(34,211,238,.3)}p{font-size:1.1rem;color:var(--text-light);margin-bottom:30px;line-height:1.6}.retry-btn{background:linear-gradient(45deg,var(--primary-dark),var(--primary));color:var(--bg-dark);border:none;padding:15px 35px;border-radius:12px;font-size:1.1rem;font-weight:700;font-family:var(--font-body);cursor:pointer;transition:all .3s ease;box-shadow:0 4px 15px rgba(34,211,238,.4);display:inline-flex;align-items:center;gap:10px;text-decoration:none}.retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,211,238,.6)}.retry-btn:active{transform:translateY(1px)}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,114,182,.4)}70%{box-shadow:0 0 0 20px rgba(244,114,182,0)}100%{box-shadow:0 0 0 0 rgba(244,114,182,0)}}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}</style></head><body><div class="container"><div class="icon-container"><i class="fas fa-wifi"></i></div><h1>Connection Lost</h1><p>It seems you are offline. Please check your internet connection and try again to access MBBS World.</p><button class="retry-btn" onclick="window.location.reload()"><i class="fas fa-redo"></i> Retry Connection</button></div></body></html>
