<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MBBS Portal - Student Login</title>
    <meta
      name="description"
      content="Secure login portal for MBBS World students. Access premium medical video lectures, notes, and question banks."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/login.css?v=1.6" />
    <link rel="stylesheet" href="css/network-status.css?v=1.6" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4359263469597920"
      crossorigin="anonymous"
    ></script>
  </head>
  <body oncontextmenu="return !1;">
    <div class="login-container">
      <div class="logo-container">
        <div class="logo-icon"><i class="fas fa-user-md"></i></div>
        <h2>MBBS World</h2>
        <p>Student Portal Login</p>
      </div>
      <div class="login-form">
        <label
          for="student-name"
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
          "
          >Full Name</label
        >
        <input
          type="text"
          id="student-name"
          class="login-input"
          placeholder="Enter your full name"
          autocomplete="name"
          aria-label="Enter your full name"
        />
        <button id="login-submit-btn" class="login-btn">
          <i class="fas fa-sign-in-alt" style="margin-right: 10px"></i> Access
          Portal
        </button>
      </div>
      <div
        id="error-message"
        style="
          color: #ff4d4d;
          margin-top: 15px;
          font-size: 0.9rem;
          text-align: center;
        "
      ></div>
      <div
        class="register-section"
        style="
          text-align: center;
          margin-top: 25px;
          padding-top: 20px;
          border-top: 1px solid rgba(255, 255, 255, 0.1);
        "
      >
        <p style="font-size: 0.9rem; color: #a0aec0; margin-bottom: 12px">
          Don't have a username yet?
        </p>
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSdzt4ivaF9fGFYGXf0eo67C5qFBEt04U12hzRNTl2c6fAS9Mg/viewform?usp=header"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: 0 0;
            border: 1.5px solid rgba(34, 211, 238, 0.4);
            color: #22d3ee;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
          "
          onmouseover="
            ((this.style.background = 'rgba(34, 211, 238, 0.1)'),
              (this.style.transform = 'translateY(-2px)'))
          "
          onmouseout="
            ((this.style.background = 'transparent'),
              (this.style.transform = 'translateY(0)'))
          "
          ><i class="fas fa-user-plus" style="margin-right: 8px"></i> Request a
          Username</a
        >
      </div>
      <div class="footer-text" style="margin-top: 25px">
        Secure Access &bull; Verified Students Only
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        set,
        update,
      } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
      const firebaseConfig = {
          apiKey: "AIzaSyCMhfZLVHzRMn-poqb-vdvpSpXlOcwjo90",
          authDomain: "samvad-bafaa.firebaseapp.com",
          databaseURL: "https://samvad-bafaa-default-rtdb.firebaseio.com",
          projectId: "samvad-bafaa",
          storageBucket: "samvad-bafaa.appspot.com",
          messagingSenderId: "131803431466",
          appId: "1:131803431466:web:b7b107308ea7197f013953",
          measurementId: "G-M90SYY2MP9",
        },
        app = initializeApp(firebaseConfig),
        database = getDatabase(app),
        analytics = getAnalytics(app);
      window.addEventListener("DOMContentLoaded", () => {
        const e = localStorage.getItem("mbbs_saved_user"),
          a = localStorage.getItem("mbbs_video_authorized");
        if (
          (e && (document.getElementById("student-name").value = e),
          e && "true" === a)
        ) {
          sessionStorage.setItem("mbbs_user", e);
          "videos" ===
          new URLSearchParams(window.location.search).get("redirect")
            ? window.location.replace("dashboard.html?view=videos")
            : window.location.replace("dashboard.html");
        }
      });
      const loginBtn = document.getElementById("login-submit-btn"),
        nameInput = document.getElementById("student-name"),
        errorDiv = document.getElementById("error-message");
      function finalizeLogin(e) {
        (localStorage.setItem("mbbs_saved_user", e),
          sessionStorage.setItem("mbbs_user", e),
          localStorage.setItem("mbbs_video_authorized", "true"),
          window.AndroidApp && window.AndroidApp.loginUser(e));
        const a = new URLSearchParams(window.location.search).get("redirect");
        setTimeout(() => {
          "videos" === a
            ? window.location.replace("dashboard.html?view=videos")
            : window.location.replace("dashboard.html");
        }, 150);
      }
      loginBtn.addEventListener("click", async () => {
        const e = nameInput.value
          .trim()
          .toLowerCase()
          .replace(/[.#$\[\]]/g, "_");
        if (!e)
          return (
            (errorDiv.style.display = "block"),
            void (errorDiv.innerText = "Please enter your name.")
          );
        ((errorDiv.style.display = "none"),
          (loginBtn.disabled = !0),
          (loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin" style="margin-right: 10px;"></i> Verifying Approval...'));
        try {
                      const a = await fetch(
              `https://script.google.com/macros/s/AKfycbz7SqCcf5L84nG_nF_KGdvZFByoSU3hd7ngDWVFs8DOXqtJZb95VbO5M0N_sodfIp4UZA/exec?name=${encodeURIComponent(e)}`,
            );
            const data = await a.json();
            
            if (data.maintenance) {
                document.querySelector('.login-container').style.display = 'none';
                
                const overlay = document.createElement('div');
                overlay.style.position = 'fixed';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = '100vw';
                overlay.style.height = '100vh';
                overlay.style.backgroundColor = '#0a0a0c';
                overlay.style.zIndex = '999999';
                overlay.style.display = 'flex';
                overlay.style.flexDirection = 'column';
                overlay.style.justifyContent = 'center';
                overlay.style.alignItems = 'center';
                overlay.style.textAlign = 'center';
                overlay.style.padding = '20px';
                
                overlay.innerHTML = 
                    <i class="fas fa-tools" style="font-size: 4rem; color: #ff0055; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,0,85,0.5); animation: cyberPulse 1.5s infinite ease-in-out;"></i>
                    <h1 style="color: #00ffcc; font-family: 'Syne', sans-serif; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0,255,204,0.3);">System Offline</h1>
                    <p style="color: #a0aec0; font-size: 1.1rem; max-width: 400px; line-height: 1.6;">${data.message || '??? MBBS World is currently undergoing server upgrades. Please check back soon!'}</p>
                ;
                document.body.appendChild(overlay);
                return;
            }
            
            if (data.announcement) {
                localStorage.setItem('mbbs_announcement', data.announcement);
            } else {
                localStorage.removeItem('mbbs_announcement');
            }
            
            if (!data.allowed)
            return (
              (errorDiv.style.display = "block"),
              (errorDiv.innerHTML =
                'Access Denied: Pending Approval.<br><span style="font-size:0.85rem;color:#a0aec0;display:block;margin-top:5px;">Please register using the "Request a Username" link below.</span>'),
              (loginBtn.disabled = !1),
              void (loginBtn.innerHTML =
                '<i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i> Access Portal')
            );
          let t;
          loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin" style="margin-right: 10px;"></i> Securing Device...';
          let i = "web_id";
          navigator.userAgent.includes("MBBSWorldApp")
            ? ((i = "app_id"),
              (t = localStorage.getItem("mbbs_device_id")),
              (t && !t.startsWith("web_")) ||
                ((t = "app_" + Math.random().toString(36).substr(2, 9)),
                localStorage.setItem("mbbs_device_id", t)))
            : ((i = "web_id"),
              (t = localStorage.getItem("mbbs_device_id")),
              (t && !t.startsWith("app_")) ||
                ((t = "web_" + Math.random().toString(36).substr(2, 9)),
                localStorage.setItem("mbbs_device_id", t)));
          const s = ref(database, "users/" + e),
            n = await get(s);
          if (n.exists()) {
            const a = n.val()[i];
            a && a !== t
              ? ((errorDiv.style.display = "block"),
                (errorDiv.innerText =
                  "Access Denied! Account linked to another device."),
                (loginBtn.disabled = !1),
                (loginBtn.innerHTML =
                  '<i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i> Access Portal'))
              : (await update(s, { [i]: t }), finalizeLogin(e));
          } else
            (await set(s, {
              name: e,
              [i]: t,
              created_at: new Date().toISOString(),
            }),
              finalizeLogin(e));
        } catch (e) {
          (console.error(e),
            (errorDiv.style.display = "block"),
            (errorDiv.innerText = "Network Error. Please check your internet."),
            (loginBtn.disabled = !1),
            (loginBtn.innerHTML =
              '<i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i> Access Portal'));
        }
      });
    </script>
    <script src="js/network-status.js?v=1.6"></script>
  </body>
</html>
